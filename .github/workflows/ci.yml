name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # --passWithNoTests lets the job succeed before any tests exist.
        # Real test failures still fail the job.
        run: npm test -- --passWithNoTests

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on HIGH or CRITICAL)
        run: npm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, security-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Dummy values for `next build`. These MUST satisfy the startup
          # secret validation in src/instrumentation.ts:
          #   - no placeholder markers (YOUR_, PASTE_, CHANGE_ME, example, test)
          #   - URLs start with https://
          #   - API keys longer than 20 characters
          # Real secrets are configured in the deployment environment (Vercel).
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-build.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-build-dummy-supabase-anon-key-do-not-use-for-real-calls'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-build-dummy-supabase-service-role-key-do-not-use-for-real-calls'
          AZURE_OPENAI_ENDPOINT: 'https://ci-build.openai.azure.com'
          AZURE_OPENAI_API_KEY: 'ci-build-dummy-azure-openai-key-do-not-use-for-real-calls'
          AZURE_OPENAI_DEPLOYMENT_NAME: 'gpt-4'
          PHI_ENCRYPTION_KEY: 'ci-build-encryption-key-32chars-no-markers-ok'
          ENCRYPTION_SALT: 'ci-build-encryption-salt-32chars-no-markers-ok'
