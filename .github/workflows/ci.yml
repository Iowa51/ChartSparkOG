name: CI

on:
  push:
    branches: [main, production, develop]
  pull_request:
    branches: [main, production]

env:
  # Test environment variables (not real secrets - safe for CI)
  PHI_ENCRYPTION_KEY: "ci-test-encryption-key-32-chars!!"
  NEXT_PUBLIC_DEMO_MODE: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Dummy env vars for build (real ones in Vercel/production)
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYxNjk2MjgwMCwiZXhwIjoxOTMyNTM4ODAwfQ.example'
          AZURE_OPENAI_ENDPOINT: 'https://example.openai.azure.com'
          AZURE_OPENAI_API_KEY: 'dummy-key-for-build'
          AZURE_OPENAI_DEPLOYMENT_NAME: 'gpt-4'
          PHI_ENCRYPTION_KEY: 'ci-build-encryption-key-32chars!!'

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Full security audit (informational)
        run: npm audit || true
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Report warnings but don't fail
